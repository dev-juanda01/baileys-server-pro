<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hermes Server · Iniciar sesión</title>
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body class="login-page">
        <div class="login-layout">
            <aside class="login-hero">
                <img src="img/hermes-logo.png" alt="Hermes Server" />
                <p class="login-hero-tagline">
                    Gestiona tus sesiones de WhatsApp — Baileys y API Oficial
                    de Meta — desde un único panel.
                </p>
            </aside>

            <main class="login-form-panel">
                <div class="login-card card">
                    <h1 class="login-title">Bienvenido</h1>
                    <p class="card-subtitle">
                        Inicia sesión para gestionar tus sesiones de WhatsApp.
                    </p>
                    <form id="form-login">
                        <div class="form-group">
                            <label for="login-username">Usuario</label>
                            <input
                                type="text"
                                id="login-username"
                                name="username"
                                required
                                autocomplete="username"
                            />
                        </div>
                        <div class="form-group">
                            <label for="login-password">Contraseña</label>
                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                required
                                autocomplete="current-password"
                            />
                        </div>
                        <div id="login-error" class="login-error" hidden>
                            <span class="material-symbols-outlined">error</span>
                            <span id="login-error-text"></span>
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            style="width: 100%"
                        >
                            <span class="material-symbols-outlined">login</span>
                            Entrar
                        </button>
                    </form>
                </div>
            </main>
        </div>

        <script>
            document
                .getElementById("form-login")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const errorBox = document.getElementById("login-error");
                    errorBox.hidden = true;

                    const username = document.getElementById("login-username").value;
                    const password = document.getElementById("login-password").value;

                    try {
                        const errorText = document.getElementById("login-error-text");
                        const res = await fetch("/api/auth/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ username, password }),
                        });
                        const data = await res.json();
                        if (!data.success) {
                            errorText.textContent =
                                data.message || "Usuario o contraseña incorrectos.";
                            errorBox.hidden = false;
                            return;
                        }
                        window.location.href = "/";
                    } catch (err) {
                        document.getElementById("login-error-text").textContent =
                            "Error de conexión con el servidor.";
                        errorBox.hidden = false;
                    }
                });
        </script>
    </body>
</html>
