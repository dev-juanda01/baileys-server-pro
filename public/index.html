<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hermes Server · Panel de Sesiones</title>
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    </head>
    <body>
        <div id="app">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-header-top">
                        <h1>
                            <span class="logo-dot"
                                ><span class="material-symbols-outlined"
                                    >bolt</span
                                ></span
                            >
                            Hermes Server
                        </h1>
                        <button
                            id="btn-logout"
                            class="btn-icon"
                            title="Cerrar sesión"
                        >
                            <span class="material-symbols-outlined"
                                >power_settings_new</span
                            >
                        </button>
                    </div>
                    <button
                        id="btn-new-instance"
                        class="btn btn-primary fab-extended"
                    >
                        <span class="material-symbols-outlined">add</span>
                        Nueva instancia
                    </button>
                    <button
                        id="btn-api-key"
                        class="btn btn-secondary btn-sm"
                        style="width: 100%; margin-top: 8px"
                    >
                        <span class="material-symbols-outlined">key</span>
                        API Key
                    </button>
                </div>
                <div class="sidebar-search">
                    <input
                        type="text"
                        id="instance-search"
                        placeholder="Buscar sesión..."
                    />
                </div>
                <div id="instance-list" class="instance-list">
                    <div class="empty-list">Cargando sesiones...</div>
                </div>
            </aside>

            <main class="main">
                <div id="empty-state" class="empty-state">
                    <div class="empty-state-icon">
                        <span class="material-symbols-outlined">forum</span>
                    </div>
                    <div>Selecciona una instancia o crea una nueva para empezar</div>
                </div>

                <div id="instance-detail" class="instance-detail" hidden>
                    <header class="detail-header">
                        <div class="detail-title">
                            <span
                                id="detail-status-dot"
                                class="status-dot"
                            ></span>
                            <h2 id="detail-session-id">-</h2>
                            <span id="detail-provider-badge" class="badge"
                                >-</span
                            >
                            <span
                                id="detail-status-label"
                                class="status-label"
                            ></span>
                        </div>
                        <div class="detail-actions">
                            <button
                                id="btn-refresh-qr"
                                class="btn btn-secondary btn-sm"
                            >
                                <span class="material-symbols-outlined"
                                    >refresh</span
                                >
                                Refrescar QR
                            </button>
                            <button
                                id="btn-migrate"
                                class="btn btn-secondary btn-sm"
                            >
                                <span class="material-symbols-outlined"
                                    >swap_horiz</span
                                >
                                Migrar ID
                            </button>
                            <button
                                id="btn-delete-session"
                                class="btn btn-danger btn-sm"
                            >
                                <span class="material-symbols-outlined"
                                    >delete</span
                                >
                                Eliminar sesión
                            </button>
                        </div>
                    </header>

                    <nav class="tabs">
                        <button class="tab-btn active" data-tab="overview">
                            Resumen / QR
                        </button>
                        <button class="tab-btn" data-tab="send">
                            Enviar Mensaje
                        </button>
                        <button class="tab-btn" data-tab="templates">
                            Plantillas
                        </button>
                        <button class="tab-btn" data-tab="settings">
                            Configuración
                        </button>
                    </nav>

                    <section id="tab-overview" class="tab-panel"></section>
                    <section
                        id="tab-send"
                        class="tab-panel"
                        hidden
                    ></section>
                    <section
                        id="tab-templates"
                        class="tab-panel"
                        hidden
                    ></section>
                    <section
                        id="tab-settings"
                        class="tab-panel"
                        hidden
                    ></section>
                </div>
            </main>
        </div>

        <div id="modal-overlay" class="modal-overlay" hidden>
            <div id="modal-content" class="modal"></div>
        </div>

        <div id="toast-container"></div>

        <script src="js/api.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
